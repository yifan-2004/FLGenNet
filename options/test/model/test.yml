# Modified: use actual registered classes, the included checkpoint and paired evaluation data.
name: FLGenNet_LOLv2
model_type: LPTNTestModel
num_gpu: 1
manual_seed: 10

datasets:
  test:
    name: LOLv2
    type: PairedImageDataset
    dataroot_gt: datasets/LOL2/Test/high
    dataroot_lq: datasets/LOL2/Test/low
    io_backend:
      type: disk

network_g:
  type: FLGenNet
  nrb_low: 5
  nrb_high: 3
  num_high: 3

path:
  pretrain_network_g: experiments/lol2.pth
  # Fail explicitly on incompatible checkpoint keys/shapes.
  strict_load_g: true

val:
  save_img: true
  suffix: ~
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false
